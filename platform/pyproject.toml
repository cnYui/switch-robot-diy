[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emcosim"
version = "0.2.0"
description = "Electronics + physics co-simulation: ESP32 firmware in QEMU, equivalent power/motor models, MuJoCo mechanics, MCP tools for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6",
  "trimesh>=4",
  "Pillow>=10",
  "mcp>=1.2",  # 1.x (FastMCP) and 2.x (MCPServer) both work
]

[project.optional-dependencies]
step = ["cascadio>=0.0.13"]
app = ["pywebview>=5", "anthropic>=2.8"]   # desktop window; Claude API-key chat backend
dev = ["pytest>=8", "gmsh>=4.11"]
# 3D-printed part strength check (emcosim.strength): FEA basis, OCC/tet meshing, plots
strength = ["scikit-fem>=9", "gmsh>=4.11", "pytetwild>=0.2", "pyamg>=5", "matplotlib>=3.7"]

[project.scripts]
emcosim = "emcosim.cli:main"

[project.gui-scripts]
emcosim-app = "emcosim.app.desktop:main"

[tool.setuptools.packages.find]
include = ["emcosim*"]

[tool.setuptools.package-data]
"emcosim.app" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
