# Builds the emcosim Windows app: patched QEMU (MSYS2/MinGW), tests on Windows,
# PyInstaller folder, Inno Setup installer. The installer is uploaded as a
# workflow artifact (Actions run page → Artifacts).
name: emcosim-windows

on:
  push:
    paths: ['platform/**', '.github/workflows/emcosim-windows.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/emcosim-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - id: key
        shell: bash
        run: echo "hash=${{ hashFiles('platform/qemu/0001-esp32-cosim-gpio-ledc-lockstep.patch', 'platform/qemu/build-windows.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: qemu-win
          key: qemu-win-${{ steps.key.outputs.hash }}
      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make bison flex diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-glib2 mingw-w64-x86_64-pixman
            mingw-w64-x86_64-libgcrypt mingw-w64-x86_64-libslirp mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson mingw-w64-x86_64-python mingw-w64-x86_64-pkgconf
      - name: Build QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        run: platform/qemu/build-windows.sh "$(cygpath -u "$GITHUB_WORKSPACE")/qemu-win"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-win
          path: qemu-win

  app:
    needs: qemu
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-win
          path: qemu-win
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[step,app,dev]" pyinstaller
      - name: Tests (firmware co-simulation through the Windows QEMU over TCP)
        working-directory: platform
        env:
          EMCOSIM_QEMU: ${{ github.workspace }}\qemu-win\qemu-system-xtensa.exe
          EMCOSIM_QEMU_ROMS: ${{ github.workspace }}\qemu-win\share\qemu
        run: pytest -q
      - name: Stage and freeze
        working-directory: platform
        run: |
          python packaging/windows/stage.py --qemu ../qemu-win
          pyinstaller packaging/windows/emcosim.spec --noconfirm
      - name: Smoke test the frozen app
        working-directory: platform
        shell: bash
        run: |
          ./dist/emcosim/emcosim.exe --version
          ./dist/emcosim/emcosim.exe --project dist/emcosim/examples/switch_robot run servo_sweep_scripted > /dev/null
          ./dist/emcosim/emcosim.exe --project dist/emcosim/examples/switch_robot run stall_brownout | tee run.json || true
          grep -q '"mcu.resets": 2' run.json
      - name: Installer
        working-directory: platform
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile packaging/windows/MicrosoftEdgeWebview2Setup.exe
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging/windows/emcosim.iss
      - uses: actions/upload-artifact@v4
        with:
          name: emcosim-windows-installer
          path: platform/dist/*.exe
          retention-days: 30
